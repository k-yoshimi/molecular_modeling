[project]
name = "molecular_modeling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ase==3.25.0",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "fonttools==4.60.2",
    "kiwisolver==1.4.8",
    "manifold3d==3.2.1",
    "matplotlib==3.10.3",
    "numpy==2.3.1",
    "packaging==25.0",
    "pillow==11.3.0",
    "pyparsing==3.2.3",
    "pytest>=7.0.0",
    "python-dateutil==2.9.0.post0",
    "scipy==1.16.0",
    "six==1.17.0",
    "trimesh==4.7.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "sphinx>=7.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"molecular_modeling" = "source"}
