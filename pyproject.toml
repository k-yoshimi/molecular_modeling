[project]
name = "molecular_modeling"
version = "0.1.0"
description = "Molecular modeling toolkit with Voronoi cell optimization on ASE"
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ase>=3.23",
    "manifold3d>=3.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "scipy>=1.14",
    "trimesh>=4.4",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "mypy>=1.0",
    "pre-commit>=4.0",
    "ruff>=0.8.0",
    "sphinx>=7.0",
]

[project.scripts]
molecular-modeling = "molecular_modeling.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"molecular_modeling" = "source"}

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["source/gui/"]
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # allow unused variables in tests
"source/gui/*" = ["F401", "F841"]  # GUI modules have conditional imports
