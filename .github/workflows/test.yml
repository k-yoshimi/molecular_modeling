name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=molecular_modeling --cov-report=term-missing

      - name: Generate coverage badge
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main'
        run: |
          TOTAL=$(pytest --cov=molecular_modeling --cov-report=term 2>/dev/null | grep '^TOTAL' | awk '{print $NF}' | tr -d '%')
          if [ -z "$TOTAL" ]; then
            TOTAL=$(python -c "
          import json, subprocess, re
          out = subprocess.run(['python', '-m', 'coverage', 'report', '--format=total'], capture_output=True, text=True)
          print(out.stdout.strip())
          ")
          fi
          echo "COVERAGE=$TOTAL" >> $GITHUB_ENV
          echo "Coverage: $TOTAL%"

      - name: Update coverage badge gist
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage-badge.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 50
          maxColorRange: 100
